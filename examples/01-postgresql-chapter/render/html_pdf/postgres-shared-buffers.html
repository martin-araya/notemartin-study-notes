/* === Reset y base =================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; line-height: 1.7; }
body {
  margin: 0;
  padding: 0;
  font-family: "Lora", "IBM Plex Serif", Georgia, "Times New Roman", serif;
  color: #222;
  background: #fff;
}
main { display: block; max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem; }

/* === Layout: TOC sidebar + main ===================================== */
body { display: block; }
.layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 2.5rem;
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem;
}
nav#toc {
  position: sticky;
  top: 1rem;
  align-self: start;
  max-height: calc(100vh - 2rem);
  overflow-y: auto;
  font-size: 0.875rem;
  line-height: 1.4;
}
nav#toc h2 {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #888;
  margin: 0 0 0.5rem 0;
  font-weight: 600;
}
nav#toc ol { list-style: none; padding: 0; margin: 0; }
nav#toc ol ol { padding-left: 1rem; margin-top: 0.2rem; }
nav#toc li { margin-bottom: 0.2rem; }
nav#toc a {
  color: #555;
  text-decoration: none;
  border-bottom: none;
  display: block;
  padding: 0.15rem 0;
}
nav#toc a:hover, nav#toc a:focus { color: #1565c0; }

@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
  nav#toc { position: static; max-height: none; }
}

/* === Tipografía ===================================================== */
h1, h2, h3, h4, h5, h6 {
  font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
  font-weight: 600;
  line-height: 1.25;
  margin: 1.8em 0 0.5em 0;
}
h1 { font-size: 2.2rem; border-bottom: 2px solid #1565c0; padding-bottom: 0.3rem; }
h2 { font-size: 1.6rem; color: #1565c0; }
h3 { font-size: 1.25rem; color: #333; }
h4 { font-size: 1.05rem; color: #444; }
h5 { font-size: 0.95rem; color: #555; }
h6 { font-size: 0.85rem; color: #777; }
p { margin: 0 0 1em 0; }
a { color: #1565c0; text-decoration: underline; text-underline-offset: 2px; }
code, kbd, samp { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 0.9em; }
small { font-size: 0.85rem; color: #777; }

/* === Header / metadata ============================================== */
header.note-meta {
  background: #f5f7fa;
  border: 1px solid #dde2e8;
  border-radius: 6px;
  padding: 0.75rem 1rem;
  font-size: 0.85rem;
  color: #555;
  margin-bottom: 1.5rem;
  font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
}
header.note-meta dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 0.75rem; margin: 0; }
header.note-meta dt { font-weight: 600; color: #333; }
header.note-meta dd { margin: 0; word-break: break-all; }

/* === Lists ========================================================== */
ul, ol { padding-left: 1.5rem; margin: 0 0 1em 0; }
ul ul, ol ol, ul ol, ol ul { margin: 0.2em 0; }
li { margin-bottom: 0.25em; }
ul.checklist { list-style: none; padding-left: 0; }
ul.checklist li { padding-left: 1.5em; position: relative; }
ul.checklist li::before {
  content: "☐";
  position: absolute;
  left: 0;
  color: #888;
}
ul.checklist li.done::before { content: "☑"; color: #2e7d32; }
ul.checklist li.done { text-decoration: line-through; color: #888; }

/* === Tablas ========================================================= */
table {
  border-collapse: collapse;
  margin: 1em 0;
  width: 100%;
  font-size: 0.95rem;
}
thead { background: #f5f7fa; }
th, td {
  border: 1px solid #dde2e8;
  padding: 0.5rem 0.75rem;
  text-align: left;
  vertical-align: top;
}
th { font-weight: 600; background: #eef2f7; }
tbody tr:nth-child(even) { background: #fafbfc; }

/* === Code blocks ==================================================== */
pre {
  background: #1e1e2e;
  color: #cdd6f4;
  padding: 1rem 1.25rem;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 0.875rem;
  line-height: 1.55;
  margin: 1em 0;
}
pre code { background: transparent; color: inherit; padding: 0; }
code:not(pre code) {
  background: #eef2f7;
  padding: 0.1em 0.35em;
  border-radius: 3px;
  color: #c0392b;
  font-size: 0.875em;
}

/* === Callouts / admonitions ========================================= */
aside.callout {
  display: grid;
  grid-template-columns: 2rem 1fr;
  gap: 0.75rem;
  padding: 1rem 1.25rem;
  margin: 1.25em 0;
  border-left: 4px solid;
  border-radius: 4px;
  background: #f8f9fa;
}
aside.callout .emoji { font-size: 1.4rem; line-height: 1; align-self: center; }
aside.callout .body { line-height: 1.6; }
aside.callout strong { display: block; margin-bottom: 0.4em; }

aside.callout-warning  { background: #fff8e1; border-color: #f57c00; }
aside.callout-info     { background: #e3f2fd; border-color: #1976d2; }
aside.callout-danger   { background: #ffebee; border-color: #c62828; color: #b71c1c; }
aside.callout-success  { background: #e8f5e9; border-color: #2e7d32; }
aside.callout-note     { background: #f5f5f5; border-color: #616161; }
aside.callout-tip,
aside.callout-question { background: #f3e5f5; border-color: #7b1fa2; }
aside.callout-example  { background: #fafafa; border-color: #757575; }

/* === Quote (criterio 3) ============================================ */
blockquote {
  margin: 1.25em 0;
  padding: 0.75rem 1.25rem;
  border-left: 4px solid #b0bec5;
  background: #fafbfc;
  color: #455a64;
  font-style: italic;
}
blockquote cite {
  display: block;
  font-style: normal;
  font-size: 0.875em;
  color: #78909c;
  margin-top: 0.5em;
}
blockquote cite::before { content: "— "; }

/* === Details / collapsible ========================================== */
details {
  margin: 1em 0;
  border: 1px solid #dde2e8;
  border-radius: 4px;
  padding: 0.25rem 0.75rem;
  background: #fafbfc;
}
details[open] { background: #fff; }
details > summary {
  cursor: pointer;
  font-weight: 600;
  padding: 0.4rem 0;
  color: #1565c0;
}
details > summary:hover { text-decoration: underline; }
details > *:not(summary) { margin: 0.5rem 0; }

/* === Diagrams / figures ============================================ */
figure {
  margin: 1.5em 0;
  text-align: center;
}
figure img, figure svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
figure figcaption {
  font-size: 0.875rem;
  color: #777;
  margin-top: 0.5em;
  font-style: italic;
}
figure.diagram {
  background: #fafbfc;
  border: 1px solid #dde2e8;
  border-radius: 6px;
  padding: 1rem;
}
pre.mermaid {
  background: #fff;

  border: 1px solid #dde2e8;
}

/* === Equations / math ============================================== */
.math { font-style: italic; }
.math-display {
  display: block;
  text-align: center;
  margin: 1em 0;
  padding: 0.5em;
  background: #fafbfc;
  border-radius: 4px;
}

/* === Properties (dl) =============================================== */
dl.properties {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 0.4rem 1rem;
  margin: 1em 0;

  background: #f5f7fa;

  border-left: 3px solid #1976d2;
}
dl.properties dt { font-weight: 600; color: #1565c0; }
dl.properties dd { margin: 0; }

/* === Backlinks (fila 8 §6) ========================================= */
aside.backlinks {
  margin: 2rem 0 0 0;
  padding: 1rem 1.25rem;
  background: #fffbea;
  border-left: 4px solid #f9a825;
  border-radius: 4px;
}
aside.backlinks h2 {
  font-size: 1rem;
  color: #b45309;
  margin: 0 0 0.5em 0;
  border-bottom: 1px dashed #f9a825;
  padding-bottom: 0.25em;
}
aside.backlinks ul { margin: 0; padding-left: 1.5rem; }

/* === Queries (fila 17 §6) ========================================== */
section.queries {
  margin: 1.5em 0;
  padding: 1rem 1.25rem;
  background: #f3e5f5;
  border-left: 4px solid #7b1fa2;
  border-radius: 4px;
}
section.queries h2 { font-size: 1rem; color: #4a148c; margin-top: 0; }

/* === Steps ========================================================== */
ol.steps { counter-reset: step; list-style: none; padding-left: 0; }
ol.steps > li {
  counter-increment: step;
  padding-left: 2.5em;
  position: relative;
  margin-bottom: 0.5em;
}
ol.steps > li::before {
  content: "Paso " counter(step);
  position: absolute;
  left: 0;
  font-weight: 600;
  color: #1565c0;
}

/* === Columns (degraded to vertical) ================================ */
.columns { display: flex; flex-direction: column; gap: 1rem; }

/* === Hr / divider ================================================== */
hr { border: 0; border-top: 1px solid #dde2e8; margin: 2em 0; }

/* === Question disclosure ========================================== */
details.question { background: #e3f2fd; border-color: #1976d2; }
details.question > summary { color: #0d47a1; }

/* === Keyboard / kbd ================================================ */
kbd {
  background: #fafbfc;
  border: 1px solid #b0bec5;
  border-radius: 3px;
  padding: 0.1em 0.4em;
  font-size: 0.85em;
  box-shadow: 0 1px 0 rgba(0,0,0,0.05);
}

/* === Source references (invisible) ================================= */

/* === Print media (PDF + browser print) ============================= */
@media print {
  @page {
    size: A4;
