# Cobertura del corpus: 14 fuentes con tipo elegido y razón no trivial.
# Esta fixture es la prueba material del criterio 2 de F65
# ("la matriz resuelve todos los casos del corpus").
cobertura:
  - fuente: "01-postgresql-chapter"
    intencion: "capas + flujo de una query"
    tipo: "T6 + T2"
    razon_no_vacia: "Arquitectura por capas del motor + secuencia de una query"
  - fuente: "02-database-internals-chapter"
    intencion: "estructuras internas (memoria, B-tree)"
    tipo: "T5 + T9 + T6"
    razon_no_vacia: "Modelo ER + regiones de memoria + capas del motor"
  - fuente: "03-rfc-7231"
    intencion: "gramática ABNF + estados HTTP"
    tipo: "T10 + T3"
    razon_no_vacia: "Gramática de métodos + máquina de estados HTTP"
  - fuente: "04-arxiv-two-column"
    intencion: "definiciones formales + teoremas"
    tipo: "sin diagrama"
    razon_no_vacia: "Texto matemático denso; tabla de teoremas si hace falta resumen"
  - fuente: "05-iso-sql-tables"
    intencion: "modelo de datos relacional"
    tipo: "T5"
    razon_no_vacia: "ER explícito del catálogo"
  - fuente: "06-kubernetes-api-ref"
    intencion: "jerarquía de recursos + RBAC"
    tipo: "T4 + T1"
    razon_no_vacia: "Jerarquía de recursos + árbol de decisión RBAC"
  - fuente: "07-docker-cli-ref"
    intencion: "capas del demonio + árbol de comandos"
    tipo: "T6 + T4"
    razon_no_vacia: "Capas del demonio + jerarquía de sub-comandos"
  - fuente: "08-conference-transcript"
    intencion: "línea temporal de intervenciones"
    tipo: "T8"
    razon_no_vacia: "Cronología por bloques temáticos"
  - fuente: "09-conference-slides"
    intencion: "una idea por slide"
    tipo: "sin diagrama"
    razon_no_vacia: "Cada slide es atómica; `:::diagram` opcional por slide"
  - fuente: "10-postgres-readme-repo"
    intencion: "dependencias del repo + flujo CI"
    tipo: "T7"
    razon_no_vacia: "Grafo de módulos + estado de jobs"
  - fuente: "11-iso-cpp-syntax"
    intencion: "gramática C++ + decisión de overload"
    tipo: "T10 + T1"
    razon_no_vacia: "Sobrecarga como T1; gramática completa en F69"
  - fuente: "12-arxiv-formulas"
    intencion: "derivaciones matemáticas"
    tipo: "sin diagrama"
    razon_no_vacia: "Ecuaciones con `:::equation`; no diagrama"
  - fuente: "13-internet-archive-scan-hostil"
    intencion: "estructura del libro (capítulos)"
    tipo: "T8"
    razon_no_vacia: "Cronología de capítulos del libro hostil"
  - fuente: "14-book-bad-numbering-hostil"
    intencion: "workflow de normalización"
    tipo: "T2"
    razon_no_vacia: "Secuencia del procedimiento de reparación de numeración"
