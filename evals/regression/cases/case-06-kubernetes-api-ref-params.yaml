id: case-06-kubernetes-api-ref-params
version: 1.0.0
corpus_source: 06-kubernetes-api-ref
profile: reference

prompt: |
  Necesito una nota api-reference para el recurso Pod v1 de Kubernetes
  (50+ parámetros documentados). Quiero la tabla canónica completa de
  parámetros (nombre, tipo, descripción, default, requerido, version
  introducida), ejemplo mínimo ejecutable, gotchas al final. Terminología
  uniforme ("Pod", "container", "spec", "status"). Sin analogías ni
  elementos pedagógicos; es referencia pura. La tabla NO debe partirse en
  múltiples notas aunque tenga 50+ filas (división semántica, no por
  conteo). Salida a Obsidian y Notion.

expected_outputs:
  notes_min: 1
  ir_files_min: 1
  ledger_required: true

assertions:
  automatic:
    - id: ledger-coverage
      type: ledger_coverage
      spec:
        ledger_path_rel: knowledge/ledger.json
        min_must_keep_terminal: 0.95
      threshold: 0.95
      validator: scripts/util/validate_ledger.py

    - id: ir-source-refs-resolvable
      type: ir_validation
      spec:
        ir_glob: ir/*.json
        require_resolvable_source_refs: true
      threshold: 1.0
      validator: scripts/util/validate_ir.py

    - id: no-truncation
      type: ledger_coverage
      spec:
        ledger_path_rel: knowledge/ledger.json
        check: no_etc_or_entre_otros_in_target_notes
      threshold: 1.0
      validator: scripts/util/validate_ledger.py

    - id: sdm-validation
      type: sdm_validation
      spec:
        sdm_path_rel: sdm.json
      threshold: 1.0
      validator: scripts/util/validate_sdm.py

  human:
    - id: rubric-application
      spec:
        rubric: evals/rubric.md
        profile: reference
        dimensions: [fidelity, coverage, traceability, pedagogy, structure, components, operational, render-fidelity]
        anchors_used: [ANC-03, ANC-04]
