id: case-09-conference-slides-diag
version: 1.0.0
corpus_source: 09-conference-slides
profile: hybrid

prompt: |
  Tengo las diapositivas de una conferencia técnica en PDF (exportadas de PPT).
  Quiero una nota hybrid: mitad reference (lista de slides con título y
  bullets clave, terminología uniforme), mitad study (intuición inicial sobre
  la tesis de la charla, analogía breve, trampa explícita si la hay). Cada
  slide con figura debe distinguir entre `syntax-diagram` (si es una
  railroad/ASN.1) y `figure` (si es screenshot o foto). Las cajas
  editoriales de las slides (callouts, "Tip", "Demo") deben mapearse a las
  directivas `:::note`/`:::warning` correctas. Salida a Obsidian.

expected_outputs:
  notes_min: 1
  ir_files_min: 1
  ledger_required: true

assertions:
  automatic:
    - id: ledger-coverage
      type: ledger_coverage
      spec:
        ledger_path_rel: knowledge/ledger.json
        min_must_keep_terminal: 0.80
      threshold: 0.80
      validator: scripts/util/validate_ledger.py

    - id: ir-source-refs-resolvable
      type: ir_validation
      spec:
        ir_glob: ir/*.json
        require_resolvable_source_refs: true
      threshold: 1.0
      validator: scripts/util/validate_ir.py

    - id: slides-not-truncated
      type: ledger_coverage
      spec:
        ledger_path_rel: knowledge/ledger.json
        check: no_etc_or_entre_otros_in_target_notes
      threshold: 1.0
      validator: scripts/util/validate_ledger.py

  human:
    - id: rubric-application
      spec:
        rubric: evals/rubric.md
        profile: hybrid
        dimensions: [fidelity, coverage, traceability, pedagogy, structure, components, operational, render-fidelity]
        anchors_used: [ANC-05]
