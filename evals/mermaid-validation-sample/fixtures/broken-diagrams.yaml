# 20 diagramas Mermaid con violaciones a propósito (F67 criterio 1).
# Cada entrada tiene id, tipo de violación, contenido Mermaid, regla esperada.
# Los bloques están envueltos en `:::diagram` con `alt` y `src` para que el
# validador los parsee.
diagramas_rotos:
