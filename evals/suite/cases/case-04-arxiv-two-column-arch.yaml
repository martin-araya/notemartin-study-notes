id: case-04-arxiv-two-column-arch
version: 1.0.0
corpus_source: 04-arxiv-two-column
profile: hybrid

prompt: |
  Tengo un preprint de arXiv en PDF a dos columnas sobre una arquitectura
  de sistema distribuido. Quiero una nota hybrid: mitad reference (figuras,
  terminología uniforme, terminología cruzada), mitad study (intuición
  inicial, analogía breve, trampa explícita sobre la principal limitación
  del sistema). Salida a Obsidian y AppFlowy. El layout a dos columnas es
  el reto: la nota debe reflejar el orden de lectura correcto, no
  entrelazado.

expected_outputs:
  notes_min: 1
  ir_files_min: 1
  ledger_required: true

assertions:
  automatic:
    - id: ledger-coverage
      type: ledger_coverage
      spec:
        ledger_path_rel: knowledge/ledger.json
        min_must_keep_terminal: 1.0
      threshold: 1.0
      validator: scripts/util/validate_ledger.py

    - id: ir-source-refs-resolvable
      type: ir_validation
      spec:
        ir_glob: ir/*.json
        require_resolvable_source_refs: true
      threshold: 1.0
      validator: scripts/util/validate_ir.py

    - id: two-column-reading-order
      type: ir_validation
      spec:
        ir_glob: ir/*.json
        check: column_aware_order
      threshold: 1.0
      validator: evals/suite/runner/check_assertions.py

  human:
    - id: rubric-application
      spec:
        rubric: evals/rubric.md
        profile: hybrid
        dimensions: [fidelity, coverage, traceability, pedagogy, structure, components, operational, render-fidelity]
        anchors_used: [ANC-05]
